        <!-- Your form with class and section dropdowns -->
        <form id="filterForm">
            <label for="classDropdown">Select Class:</label>
            <select id="classDropdown" name="class" onchange="updateSections()">
              <option value="">Select Class</option>
              <option value="class1">Class 1</option>
              <option value="class2">Class 2</option>
            </select>
          
            <label for="sectionDropdown">Select Section:</label>
            <select id="sectionDropdown" name="section">
              <!-- Sections will be dynamically populated based on the selected class -->
            </select>
          
            <button type="submit">Filter</button>
          </form>
          

          <script>
            function updateSections() {
              // Get the selected class value
              var selectedClass = document.getElementById("classDropdown").value;
            
              // Get the section dropdown element
              var sectionDropdown = document.getElementById("sectionDropdown");
            
              // Clear existing options
              sectionDropdown.innerHTML = "";
            
              // Define sections based on the selected class
              var sections = {};
              sections.class1 = ["Shapla", "Golap", "Joba"];
              sections.class2 = ["Peyara", "Lichu"];
            
              // Populate section options based on the selected class
              var sectionOptions = sections[selectedClass] || [];
            
              // Add default option
              var defaultOption = document.createElement("option");
              defaultOption.text = "Select Section";
              sectionDropdown.add(defaultOption);
            
              // Add section options
              sectionOptions.forEach(function (section) {
                var option = document.createElement("option");
                option.value = section.toLowerCase();
                option.text = section;
                sectionDropdown.add(option);
              });
            }
            </script>
